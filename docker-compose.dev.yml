version: '3.8'

# Dev mode: only infra services. App runs locally via `npm run start:dev`
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trace backend for the Python fraud engine. Local dev only — spans are kept
  # in memory and vanish with the container.
  # UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # Jaeger 1.x does not listen for OTLP unless asked; without this the
      # exporter's gRPC connection is refused on 4317.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # web UI
      - "4317:4317"    # OTLP gRPC — matches OTEL_EXPORTER_OTLP_ENDPOINT

volumes:
  postgres_data: